<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 300" width="1240" height="300">
  <title>OpenTake</title>
  <svg x="0" y="0" width="300" height="300" viewBox="0 0 1024 1024">
  
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#30333C"/>
      <stop offset="1" stop-color="#121317"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.03"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <!-- The open ring: cool blue at the bottom-left warming to red where it meets the record dot. -->
    <linearGradient id="ring" x1="250" y1="790" x2="770" y2="250" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2F7BFF"/>
      <stop offset="0.5" stop-color="#8B5CFF"/>
      <stop offset="1" stop-color="#FF4D6A"/>
    </linearGradient>
    <linearGradient id="bars" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#C9D2E3"/>
    </linearGradient>
    <radialGradient id="dot" cx="0.38" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#FF8A80"/>
      <stop offset="0.55" stop-color="#FF453A"/>
      <stop offset="1" stop-color="#D92B22"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>

  <!-- App tile (macOS icon grid: 824 px tile with a soft shadow). -->
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  </g>
  <rect x="101.5" y="101.5" width="821" height="821" rx="185" fill="none" stroke="url(#rim)" stroke-width="3"/>

  <!-- Glow under the ring and dot. -->
  <g opacity="0.55" filter="url(#glow)">
    <path d="M 746.9 426.5 A 250 250 0 1 1 576.7 270.5" fill="none" stroke="url(#ring)" stroke-width="64" stroke-linecap="round"/>
    <circle cx="680.9" cy="327.7" r="46" fill="#FF453A"/>
  </g>

  <!-- The "O": an open ring with its gap at the upper right. -->
  <path d="M 746.9 426.5 A 250 250 0 1 1 576.7 270.5" fill="none" stroke="url(#ring)" stroke-width="64" stroke-linecap="round"/>

  <!-- The take: a record dot sitting in the gap. -->
  <circle cx="680.9" cy="327.7" r="46" fill="url(#dot)"/>

  <!-- Audio inside the ring. -->
  <g fill="url(#bars)">
    <rect x="383" y="467" width="34" height="90" rx="17"/>
    <rect x="439" y="417" width="34" height="190" rx="17"/>
    <rect x="495" y="377" width="34" height="270" rx="17"/>
    <rect x="551" y="432" width="34" height="160" rx="17"/>
    <rect x="607" y="477" width="34" height="70" rx="17"/>
  </g>
</svg>
  <text x="318" y="168" font-family="SF Pro Display, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="128" letter-spacing="-2" fill="#F2F4F8"><tspan font-weight="300">Open</tspan><tspan font-weight="700">Take</tspan></text>
  <text x="324" y="226" font-family="SF Pro Text, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" fill="#9AA3B2">The open-source DAW you can drive with AI agents</text>
</svg>