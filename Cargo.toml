[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
opentake-engine = { path = "crates/opentake-engine" }
opentake-vst3 = { path = "crates/opentake-vst3" }
opentake-au = { path = "crates/opentake-au" }
opentake-project = { path = "crates/opentake-project" }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
cpal = "0.18"
hound = "3.5"
rtrb = "0.4"
crossbeam-channel = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
tokio = { version = "1", features = ["full"] }
rmcp = { version = "3.7", features = ["server", "transport-io", "transport-streamable-http-server", "macros"] }
axum = "0.8"
vst3 = "0.3"
libloading = "0.9"
clap = { version = "4", features = ["derive"] }
eframe = "0.37"
egui = { version = "0.37", features = ["monochrome_emoji_fonts"] }
rfd = "0.17"
dirs = "7"
zip = { version = "9", default-features = false, features = ["deflate"] }
roxmltree = "0.21"
flate2 = "1"
flacenc = "0.5"
midly = "0.5"
midir = "0.11"
signalsmith-stretch = "0.1"

# Region pitch/stretch renders in C++; keep it fast in debug builds too.
[profile.dev.package.signalsmith-stretch]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
